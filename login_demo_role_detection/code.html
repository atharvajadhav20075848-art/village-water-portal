<script src="/public/js/auth-persist.js"></script>
<script>
document.getElementById('manualLoginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('userId').value;
  const password = document.getElementById('password').value;
  
  let lat = null;
  let lon = null;
  try {
    const position = await new Promise((resolve, reject) => {
      navigator.geolocation.getCurrentPosition(resolve, reject, { timeout: 10000, maximumAge: 0 });
    });
    lat = position.coords.latitude;
    lon = position.coords.longitude;
  } catch (err) {
    console.warn("Geolocation issue.", err);
    if (err.code === 1) {
      alert("Location access was blocked by your browser! We will use a rough network estimate. To fix this, Allow Location in site settings.");
    } else {
      console.log("Could not get precise location (timeout/unavailable). Using fallback.");
    }
  }

  try {
    const res = await fetch('/api/auth/manual', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password, lat, lon })
    });
    if (res.ok) {
      const data = await res.json();
      localStorage.setItem('gram_user_email', data.user.email);
      localStorage.setItem('gram_user_role', data.user.role);
      const isMobile = window.innerWidth <= 768;
      window.location.href = isMobile ? '/app' : '/home';
    } else {
      const err = await res.json();
      alert(err.message || 'Invalid credentials');
      return;
    }
  } catch (err) {
    console.error(err);
    alert('Server error');
  }
});

async function handleCustomGoogleClick() {
  if (window.google && google.accounts && google.accounts.id) {
    try {
      google.accounts.id.prompt((notification) => {
        if (notification.isNotDisplayed() || notification.isSkippedMoment()) {
          promptGoogleFallback();
        }
      });
      return;
    } catch (e) {
      console.warn("GSI Prompt error:", e);
    }
  }
  promptGoogleFallback();
}

async function promptGoogleFallback() {
  const email = prompt("Sign in with Google - Enter your Google/Gmail ID:\n(e.g. yourname@gmail.com)");
  if (!email || !email.trim()) return;

  let lat = null, lon = null;
  try {
    const pos = await new Promise((res, rej) => navigator.geolocation.getCurrentPosition(res, rej, { timeout: 4000 }));
    lat = pos.coords.latitude;
    lon = pos.coords.longitude;
  } catch (e) {}

  try {
    const res = await fetch('/api/auth/google', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: email.trim(), lat, lon })
    });
    if (res.ok) {
      const data = await res.json();
      localStorage.setItem('gram_user_email', data.user.email);
      localStorage.setItem('gram_user_role', data.user.role);
      const isMobile = window.innerWidth <= 768;
      window.location.href = isMobile ? '/app' : '/home';
    } else {
      const err = await res.json();
      alert(err.message || err.error || 'Google login failed.');
    }
  } catch (err) {
    console.error(err);
    alert('Server error connecting to Google Auth.');
  }
}

// Auto-login persistent check
async function checkExistingSession() {
  const savedEmail = localStorage.getItem('gram_user_email');
  if (savedEmail) {
    try {
      const res = await fetch('/api/auth/status', {
        headers: { 'x-user-email': encodeURIComponent(savedEmail) }
      });
      const data = await res.json();
      if (data.loggedIn) {
        const isMobile = window.innerWidth <= 768;
        window.location.href = isMobile ? '/app' : '/home';
      }
    } catch (e) {}
  }
}
checkExistingSession();
</script>
